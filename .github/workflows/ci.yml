name: Verify and Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: npm.cmd test
      - name: Check extension and engine integrity
        run: npm.cmd run check
      - name: Package browser standalone edition
        id: package
        run: |
          npm.cmd run package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packageVersion = (Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: xiangqi-quick-hands-v${{ steps.package.outputs.version }}
          path: |
            xiangqi-quick-hands-v${{ steps.package.outputs.version }}.zip
            SHA256SUMS.txt
          if-no-files-found: error
