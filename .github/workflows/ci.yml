name: Verify and Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: npm.cmd test
      - name: Check extension and engine integrity
        run: npm.cmd run check
      - name: Package browser and Windows editions
        run: npm.cmd run package
      - uses: actions/upload-artifact@v4
        with:
          name: xiangqi-quick-hands-${{ github.sha }}
          path: |
            xiangqi-quick-hands.zip
            xiangqi-pikafish-windows.zip
          if-no-files-found: error
